i életút", "scope": "Vezetői felelősség és projektek", "research": "Tudományos kutatás", "education": "Végzettségek és képzések", "skills": "Szakmai kompetenciák", "contact": "Kapcsolat és együttműködés", "contacttxt": "Ipari műszaki vezetői, energetikai, karbantartási, kutatás-fejlesztési és tudományos együttműködésekhez.", "pub": "Publikációk", "pubtxt": "A hitelesített publikációs lista és DOI-hivatkozások közzététel előtt kerülnek be.", "lang": "Nyelvtudás", "train": "Szakmai továbbképzések", "statlabels": ["ipari mérési kampány", "mérési rekord", "gépi tanulási modell", "MATLAB-kód"], "jobs": [["2008–*", "ZF Hungária Kft., Eger | Facility Manager; korábban energetikai, környezetirányítási és infrastruktúra-csoportvezető", "2008–2018: energetikai, környezetirányítási és infrastruktúra-csoportvezető. 2018-tól: Facility Manager, a CVS és ES gyárak létesítményüzemeltetésének vezetése. Két autóipari sebességváltógyár (CVS és ES) létesítményüzemeltetésének és műszaki infrastruktúrájának vezetése: 240 000 m² telephely és 115 000 m² épület. Közvetlen vezetői felelősség a ZF-nél betöltött munkakörök során összesen 32 munkatársra: 4 facility mérnök, 3 környezetirányítási (KIR) mérnök, 3 fő energetikus (EIR) mérnök, 3 fő munkabiztonsági és munkaegészségügyi (MEBIR) mérnök, 7 kertész és 12 háztechnikus; továbbá külső vállalkozók irányítása. Az ES gyár zöldmezős beruházásához kapcsolódó létesítményüzemeltetési feladatok koordinálása a tervezéstől és kivitelezéstől a próbaüzemen, garanciális javításokon és az üzemeltetés fejlesztésén át. A COVID–19 járvány (2020–2022) létesítményüzemeltetési feladatainak kezelése. A korábbi energetikai és infrastruktúra-felelősségi körök egy része megmaradt; 2019-től a megnövekedett feladatok miatt az EHS-terület szakmai támogatása tanácsadóként, közvetlen szervezeti irányítás nélkül. Korábbi vezetői feladatkör (2008–2018): Energetikai, környezetirányítási és infrastruktúra-csoport vezetése a 170 000 m²-es telephelyen és 75 000 m² épületállományon. Egy energetikai mérnök, egy környezetirányítási mérnök, munkavédelmi és tűzvédelmi felelősök, létesítménykarbantartók és külső vállalkozók munkájának szakmai irányítása. Villamosenergia-, földgáz-, ipari- és ivóvízellátás; kazánházak, gázfogadó és mérőállomások, kompresszorok és sűrítettlevegő-rendszerek, technológiai fűtés/hűtés, vízkezelés, csapadék- és szennyvízhálózatok, épületek, utak, parkolók, zöldterületek és üzemi vendéglátó infrastruktúra üzemeltetése. Karbantartási tervek, éves nagykarbantartások, stratégiai pótalkatrészek, beruházások, költségkeretek (BAB), beszerzések, szerződések és szolgáltatók felügyelete; hibák és leállások elemzése, Pareto-elemzések, vezetői riportok. ISO/TS 16949, ISO 14001, ISO 50001 és munkavédelmi/tűzvédelmi irányítási követelmények szerinti működés támogatása; veszélyes hulladékok kezelésének felügyelete, munkavédelmi és tűzvédelmi felelősök irányítása. A 2009–2010-es gazdasági válság idején megtakarítási és racionalizálási intézkedések kidolgozása és megvalósítása."], ["2007. augusztus – 2008. április", "Karbantartásvezető | Firth Rixson Hungaria Kft., Eger", "A karbantartási terület vezetése, 5 villamos és 6 gépész karbantartó irányítása csoportvezetők bevonásával. A termelőberendezések folyamatos rendelkezésre állásának biztosítása; napi, megelőző és éves nagykarbantartások tervezése és ellenőrzése; hibaanalízis, Pareto-elemzések, stratégiai pótalkatrészek, beszerzések, beszállítók és tenderek felügyelete. Villamos és gépész karbantartás, középfeszültségű berendezések és transzformátorállomás, villamosenergia-gazdálkodás, valamint IT- és távközlési rendszerek koordinálása. A vezetői feladatkörön belül gyárbővítési, gépáttelepítési, PLC-automatizálási és ipari adatgyűjtési fejlesztésekben való részvétel."], ["2004. március – 2007. augusztus", "Villamosmérnök | Firth Rixson Hungaria Kft., Eger", "Villamos karbantartók szakmai vezetése, karbantartási tervek, villamos energetikai, IT- és távközlési rendszerek felügyelete; PLC-rendszerek fejlesztése."], ["2003. május – 2004. március", "Diplomamunka és egyéb tevékenységek", "Államvizsgához kapcsolódó diplomamunka, PIC-mikrokontroller-programozás; a forrás szerint mezőgazdasági tevékenység is."], ["1997. július – 2003. május", "Technikusok vezetője | Eger Moda Kft., Egercsehi", "Tízfős műszaki csoport szakmai irányítása, varróipari gépek üzemben tartása, fejlesztések, olasz alkatrészbeszerzés és olasz–magyar műszaki tolmácsolás."], ["1999. szeptember – 1999. december", "Művezető | Kék Tisza Kft., Tiszafüred", "Gépek programozása és javítása, minőségi működés biztosítása. Az időszak a forrásban átfed a másik munkaviszonnyal."], ["1994. július – 1997. július", "Mechanikus és villamos karbantartó | Confezioni Kis Kft., Bükkszenterzsébet", "Varróipari gépek javítása, épületvillamossági és infrastruktúra-feladatok."], ["1991. február – 1994. május", "Mechanikus és villamos karbantartó | Heves Megyei Ruházatiipari Vállalat, Pétervására", "Varróipari gépek javítása, épületvillamossági és infrastruktúra-feladatok."], ["1987. szeptember – 1989. november", "Elektronikai technikus | MH Bem József Laktanya, Pétervására", "Katonai rádióberendezések karbantartása, ellenőrzése és javítása."]], "projects": [["ZF Hungária – műszaki vezetés, infrastruktúra és gyárfejlesztés (2008–)", "2008–2018: energetikai, környezetirányítási és infrastruktúra-csoport vezetése; 2018-tól a CVS és ES gyárak facility-üzemeltetésének irányítása. Facility Manager (2018–): a CVS és ES gyárak 240 000 m²-es telephelyének és 115 000 m²-es épületállományának üzemeltetése; 4 mérnök, 12 technikus/karbantartó és külső vállalkozók vezetése. EHS-tanácsadói szerep 2019-től. Az ES zöldmezős gyárberuházás facility-feladatainak koordinálása: tervezés, kivitelezés, próbaüzem, garanciális javítások és az üzemeltetés fejlesztése; a 2020–2022-es COVID-időszak üzemeltetési feladatai. Csoportvezetői felelősség a villamosenergia-, gáz-, víz- és sűrítettlevegő-ellátás, kazánházak, fűtés/hűtés, épületek és közműhálózatok területén. Karbantartás, beruházások, energiahatékonyság, ISO 14001/50001, munkavédelem és tűzvédelem; 170 000 m² telephely, 75 000 m² épület."], ["Firth Rixson – karbantartásvezetés és kapcsolódó fejlesztések", "Elsődleges feladat: 5 villamos és 6 gépész karbantartó vezetése; üzembiztonság, karbantartástervezés, hibaelhárítás, energiafelhasználás és beszállítók felügyelete. Kapcsolódó projektek: új gyártócsarnok kialakítása és brit gyártóberendezések áttelepítésének villamos/gépészeti műszaki koordinálása; villamosenergia-piaci szerződések (7 MW kapacitás, 2 GWh éves fogyasztás); présgépek webszerveres adatgyűjtése; hőmérséklet-, nyomás-, áramlás- és rezonanciamérések; Mitsubishi, Siemens és Omron PLC-k fejlesztése, CC-Link kommunikáció."], ["EHS – környezetirányítás (KIR), egészségvédelem és munkabiztonság (MEBIR), tűzvédelem és energiagazdálkodás (EIR)", "Az EHS (Environment, Health and Safety) feladatkör nálam a környezetirányítást (KIR), az egészségvédelmet és munkabiztonságot (MEBIR), valamint ezek mellett a tűzvédelmet és az energiagazdálkodást (EIR) is magában foglalta. Villamosenergia-, földgáz-, ivóvíz-, iparivíz- és sűrítettlevegő-ellátás, valamint az épületek és technológiai rendszerek fűtési-hűtési infrastruktúrájának műszaki felügyelete. Energiapiaci szerződések, fogyasztás- és költségelemzés, energiahatékonysági intézkedések, szolgáltatói kapcsolattartás és a szolgáltatói munkák ellenőrzése. Az ISO 50001 szerinti energiagazdálkodási feladatok koordinálása; szerződések előkészítése, nyilvántartása és ellenőrzése, számlák igazolása, üzembe helyezési és telepítési dokumentáció kezelése, éves és féléves energetikai, karbantartási és infrastruktúra-fejlesztési tervek készítése, az energetikai dokumentumtár felügyelete. Környezetirányítás: a környezetvédelmi felelős munkájának szakmai irányítása és ellenőrzése, az ISO 14001 szerinti működés felügyelete, a veszélyes hulladékok kezelésének fokozott ellenőrzése, a hulladékgazdálkodási terv szerinti tevékenységek koordinálása és fejlesztése, ajánlatok bekérése és feldolgozása. Munkavédelem és tűzvédelem: a kijelölt munkatárs szakmai irányítása, az eseti és napi feladatok ellenőrzése, valamint az ISO 45001 szerinti munkavédelmi irányítási követelményeknek megfelelő működés felügyelete. A munkavédelmi és tűzvédelmi terület 2019-től a megváltozott szervezeti felelősség szerint tanácsadói támogatásként kapcsolódik a Facility Manager szerepkörhöz."]], "researchintro": "Doktori kutatásom központi eredménye egy egységes, villamos harmonikus spektrumból származtatott állapotinformációkra épülő intelligens állapotfelügyeleti és prediktív karbantartási keretrendszer. A kutatás három egymásra épülő tudományos tézise az állapotjellemzést, az adaptív karbantartási döntéstámogatást és az OAP önadaptív metaarchitektúrát kapcsolja össze.", "cases": [["H1 · Ipari alkatrészmosó", "2297 mérési rekord; LSTM-predikciós hibán alapuló anomáliadetektálás, 12 jelzés a tesztszakaszban."], ["H2 · Házgyártó berendezés", "565 rekord; optimalizált LSTM és szabályalapú állapotértékelés, SAP PM karbantartási dokumentációval összevetve."], ["H3 · Komfort folyadékhűtő", "3722 rekord; adaptív állapotértékelés, berendezésriasztással és szervizdokumentációval összevetve."], ["OAP · Organically Adaptive Predictive", "Saját fejlesztésű önadaptív prediktív metaarchitektúra; statikus, dinamikus és hibrid döntési mód, EWMA-alapú driftjellemzés, dinamikus küszöbkorrekció és perzisztencia."]], "degrees": [["2023–", "Miskolci Egyetem", "PhD-hallgató – Hatvany József Informatikai Tudományok Doktori Iskola"], ["2021–2023", "Miskolci Egyetem", "Villamosmérnök MSc, folyamatirányítási specializáció (PLC, SCADA, DCS, ipari kommunikáció, mérőrendszerek); kitüntetéses diploma"], ["2000–2004", "Miskolci Egyetem", "Villamosmérnöki alapdiploma; digitális rendszerek, mikroprocesszorok, PLC, FPGA, CPLD; kiváló záróvizsga"], ["1983–1987", "Vak Bottyán János Műszaki Középiskola, Gyöngyös", "Villamosipari technikus"]], "courses": [["1999–2000", "Benetton, Vicenza – textilipari technológia és raktározás automatizálása"], ["2008", "Manpower – vezetői készségfejlesztés"], ["2006", "L+L – tűzvédelmi vizsga"], ["2005", "Valid Management Academy – ISO/TS 16949 és ISO 14001"], ["2004", "ÉKKO – mérlegkezelő"], ["1999", "FAMACC és COMEL, Olaszország – gépészeti/pneumatikai, gőzfejlesztő és ipari vasalóberendezés-képzés"], ["1998", "BMI, Olaszország – gépészeti továbbképzés"], ["1997–1999", "Benetton Group, Vicenza – olasz–magyar műszaki nyelv"], ["1989–1990", "BMTTI, Budapest – tartalékos tisztképzés"]], "langs": "Magyar: anyanyelv · Olasz: tárgyalóképes · Angol: szakmai munkakommunikáció", "foot": "* A „jelenleg” megjelölés a 2026. augusztus 9-én mentett CV állapotát tükrözi; a jelenlegi munkaviszony státusza publikálás előtt megerősítendő.", "researchHeading": "Kutatási összefoglaló és tudományos hozzájárulások", "researchBlocks": [["Harmonikus spektrum mint állapotinformáció-forrás", "A villamos harmonikus spektrum nem közvetlen hibadiagnózis, hanem többdimenziós állapotinformáció forrása. Matematikai feldolgozással, jellemzőképzéssel és gépi tanulással a meghibásodással összefüggő állapotváltozások elkülöníthetők a természetes üzemi ingadozásoktól."], ["Adaptív prediktív karbantartás", "A prediktív modellezés, statisztikai értékelés, klaszterezés és szabályalapú döntéstámogatás együttesen segíti a riasztási szintek, karbantartási prioritások és beavatkozási javaslatok meghatározását. A Warning állapotokat SAP PM karbantartási és meghibásodási adatokkal vetettem össze."], ["OAP – Organikusan Adaptív Prediktív metaarchitektúra", "A biológiai homeosztázis működési analógiájára épülő OAP nem új gépi tanulási algoritmus, hanem a predikciós hiba kiértékelését adaptáló magasabb szintű architektúra. Dinamikus küszöbérték-képzést, driftfüggő korrekciót és perzisztenciaalapú döntést alkalmaz; folyamatos modell-újratanítást nem feltételez."], ["Ipari empirikus validáció", "A valós ipari mérési adatokon végzett vizsgálat 39 dinamikus anomáliaepizódot azonosított. A berendezés eseménynaplójában dokumentált EE206 „Comp 1 protections” Critical (A) esemény az OAP kilencedik dinamikus epizódjának időablakába esett. Az időbeli egyezés alátámasztja az üzemi relevanciát, de önmagában nem igazol oksági kapcsolatot."], ["Gyakorlati alkalmazhatóság", "Megfelelő harmonikus felbontású és minőségű ipari villamosenergia-monitorozó adatok esetén a módszertan önálló diagnosztikai mérőrendszer nélkül is támogathatja az állapotfelügyeletet. Az alkalmazás berendezésspecifikus jellemzőválasztást, modelltanítást és küszöbérték-beállítást igényel."], ["További kutatási irányok", "Online, közvetlen mérési adatkapcsolat és hosszú távú ipari validáció; ellenőrzött modell-újrakalibrálás; magyarázható MI; mérési bizonytalanságok kezelése; fázisszög-információk; szintetikus adatbővítés és domainadaptáció; Digital Twin és Edge AI. A könyvben bemutatott Jetson/ONNX demonstráció korábban rögzített adatok időrendben történő feldolgozására épült, nem hosszú távú, közvetlen online ipari validációra."]]}, "en": {"nav": ["About", "Industry career", "Research", "Education", "Expertise", "Contact"], "eyebrow": "INDUSTRIAL ENGINEERING LEADERSHIP  ×  SCIENTIFIC RESEARCH", "headline": "Engineering experience and scientific innovation in one profile.", "sub": "Electrical Engineer · Facility & Maintenance Leadership · Energy Management · Predictive Maintenance · Industrial AI", "herocta": "Career timeline", "herocta2": "Research outcomes", "abouttitle": "Professional profile", "about": ["My career spans electronics and electrical engineering, industrial maintenance, energy management and large-scale facility leadership. In automotive and manufacturing environments, I have worked on operational reliability, capital projects, automation, utility systems, contractor coordination and multidisciplinary technical team management.", "In parallel, as a doctoral student at the University of Miskolc, I research machine-learning analysis of electrical current harmonics, anomaly detection and adaptive predictive maintenance decision support. My focus is connecting industrial practice with reproducible scientific methodology."], "pillars": ["Industrial leadership and operations", "Scientific research and development"], "pillartxt": ["Factory facilities, technical infrastructure, utilities, maintenance, investments, EHS coordination, supplier management and technical teams.", "Electrical diagnostics, time-series modelling, LSTM, anomaly detection, optimization and adaptive decision support based on real industrial measurement data."], "career": "Industrial career timeline", "scope": "Leadership scope and selected projects", "research": "Scientific research", "education": "Education and training", "skills": "Technical expertise", "contact": "Contact and collaboration", "contacttxt": "For industrial engineering leadership, energy management, maintenance, R&D and academic collaboration.", "pub": "Publications", "pubtxt": "A verified publication list and DOI links will be added before public release.", "lang": "Languages", "train": "Professional training", "statlabels": ["industrial measurement campaigns", "measurement records", "machine-learning models", "MATLAB scripts"], "jobs": [["2008–*", "ZF Hungária Kft., Eger | Facility Manager; previously Energy, Environmental Management and Infrastructure Group Leader", "2008–2018: Energy, Environmental Management and Infrastructure Group Leader. Since 2018: Facility Manager overseeing the CVS and ES factories. Led facilities management and technical infrastructure for two automotive transmission plants (CVS and ES), covering 240,000 m² of site area and 115,000 m² of buildings. Direct management responsibility across ZF roles for 32 employees: 4 facility engineers, 3 environmental management (KIR) engineers, 3 energy management (EIR) engineers, 3 occupational health and safety (MEBIR) engineers, 7 gardeners and 12 facility technicians; also managed external contractors. Coordinated facility-related responsibilities for the ES greenfield investment, including planning, construction, trial operation, warranty repairs and development of ongoing operations. Managed facility-related requirements during the 2020–2022 COVID-19 period. Retained part of the previous energy and infrastructure responsibilities; from 2019, provided advisory support to the EHS function rather than direct line management due to the expanded two-plant workload. Earlier leadership responsibilities (2008–2018): Led the energy, environmental management and infrastructure function for a 170,000 m² industrial site with 75,000 m² of buildings. Supervised an energy engineer, an environmental engineer, occupational and fire-safety representatives, facility maintenance staff and external contractors. Oversaw electricity, natural gas, industrial and drinking water, boiler houses, gas receiving and metering stations, compressors and compressed-air systems, process heating and cooling, water treatment, stormwater and wastewater networks, buildings, roads, parking areas, green spaces and factory catering infrastructure. Managed preventive maintenance, annual major shutdown maintenance, strategic spare parts, investments, budgets (BAB), procurement, contracts and utility suppliers; performed downtime analysis, Pareto analysis and management reporting. Supported operations under ISO/TS 16949, ISO 14001, ISO 50001 and occupational/fire-safety management requirements; supervised hazardous-waste management and relevant safety personnel. Led cost-saving and operational rationalisation measures during the 2009–2010 economic crisis."], ["August 2007 – April 2008", "Maintenance Leader | Firth Rixson Hungaria Kft., Eger", "Led the maintenance function, supervising 5 electrical and 6 mechanical maintenance technicians through team leaders. Ensured production equipment availability; planned and controlled daily, preventive and annual major maintenance; oversaw breakdown and Pareto analyses, strategic spare parts, purchasing, suppliers and tenders. Responsible for electrical and mechanical maintenance, medium-voltage equipment and the transformer station, electrical energy management, and coordination of IT and telecommunications systems. Factory expansion, equipment relocation, PLC automation and industrial data-acquisition projects were additional responsibilities within the maintenance leadership role."], ["March 2004 – August 2007", "Electrical Engineer | Firth Rixson Hungaria Kft., Eger", "Technical supervision of electrical maintenance technicians, maintenance procedures, electrical utilities, IT and telecommunications systems, and PLC development."], ["May 2003 – March 2004", "Degree project and other activities", "Final-degree project work, PIC microcontroller programming and, as recorded in the source, agricultural activities."], ["July 1997 – May 2003", "Technician Team Leader | Eger Moda Kft., Egercsehi", "Technical management of a ten-person group, sewing machinery reliability, technical development, procurement from Italy and Italian–Hungarian technical interpretation."], ["September 1999 – December 1999", "Foreman | Kék Tisza Kft., Tiszafüred", "Machine programming and repair, quality of operation. Dates overlap with another role as recorded in the source CV."], ["July 1994 – July 1997", "Mechanical and Electrical Maintenance | Confezioni Kis Kft., Bükkszenterzsébet", "Repair of sewing machines and electrical maintenance of buildings and infrastructure."], ["February 1991 – May 1994", "Mechanical and Electrical Maintenance | Heves County Clothing Industrial Company, Pétervására", "Repair of sewing machines and electrical maintenance of buildings and infrastructure."], ["September 1987 – November 1989", "Electronics Technician | MH Bem József Barracks, Pétervására", "Maintenance, inspection and repair of military radio equipment."]], "projects": [["ZF Hungária – engineering leadership, infrastructure and plant development (2008–)", "2008–2018: leadership of energy, environmental management and infrastructure; since 2018: facilities management for the CVS and ES plants. Facility Manager (2018–): operational responsibility for 240,000 m² of site area and 115,000 m² of buildings across CVS and ES; leadership of four engineers, 12 technicians/maintenance staff and external contractors. EHS advisory role from 2019. Facility-related coordination of the ES greenfield investment: design, construction, trial operation, warranty repairs and operational development; facility response during the 2020–2022 COVID period. Group leadership covering electricity, gas, water and compressed air supply, boiler houses, heating/cooling, buildings and utilities. Maintenance, investments, energy efficiency, ISO 14001/50001, occupational and fire safety; 170,000 m² site area and 75,000 m² of buildings."], ["Firth Rixson – maintenance leadership and associated projects", "Primary role: led 5 electrical and 6 mechanical maintenance technicians, overseeing equipment availability, maintenance planning, fault resolution, energy use and suppliers. Associated projects included a new production bay and electrical/mechanical coordination of equipment relocation from the UK; electricity-market contracts (7 MW capacity, 2 GWh annual consumption); web-server-based press-machine data acquisition; temperature, pressure, flow and resonance measurements; and Mitsubishi, Siemens and Omron PLC development with CC-Link communications."], ["EHS – Environment, Health and Safety, extended with Fire Protection and Energy Management (EIR)", "In my area of responsibility, EHS (Environment, Health and Safety) encompassed environmental management (KIR), occupational health and safety (MEBIR), and was extended to include fire protection and energy management (EIR). Technical oversight of electricity, natural gas, drinking water, industrial water and compressed-air supplies, together with building and process heating/cooling infrastructure. Energy-market contracts, consumption and cost analysis, energy-efficiency measures, liaison with utility providers and supervision of their work. Coordination of energy-management activities in accordance with ISO 50001; preparation, registration and review of contracts, invoice verification, commissioning and installation documentation, annual and semi-annual energy, maintenance and infrastructure-development plans, and oversight of energy records and archives. Environmental management: professional supervision and review of the environmental officer’s work, oversight of operations in accordance with ISO 14001, enhanced supervision of hazardous-waste management, coordination and continuous improvement of activities under the waste-management plan, and obtaining and evaluating quotations. Occupational health and safety and fire protection: supervision of the designated responsible colleague, review of ad hoc and day-to-day tasks, and oversight of occupational health and safety management in accordance with ISO 45001. From 2019, following the change in organizational responsibilities, EHS support continued in an advisory capacity within the Facility Manager role."]], "researchintro": "My doctoral research develops a unified intelligent condition-monitoring and predictive-maintenance framework based on state information derived from electrical harmonics. Its three interconnected scientific contributions combine harmonic-based condition characterization, adaptive maintenance decision support and the self-adaptive OAP meta-architecture.", "cases": [["H1 · Industrial parts washer", "2,297 measurement records; LSTM prediction-error anomaly detection, with 12 indications in the test period."], ["H2 · Housing production machine", "565 records; optimized LSTM and rule-based condition assessment cross-checked against SAP PM maintenance records."], ["H3 · Comfort water chiller", "3,722 records; adaptive condition assessment cross-checked against equipment alarms and service documentation."], ["OAP · Organically Adaptive Predictive", "Self-developed adaptive predictive meta-architecture: static, dynamic and hybrid decision modes, EWMA-based drift characterization, dynamic threshold correction and persistence logic."]], "degrees": [["2023–", "University of Miskolc", "PhD student – Hatvany József Doctoral School of Information Science"], ["2021–2023", "University of Miskolc", "MSc in Electrical Engineering, process-control specialization (PLC, SCADA, DCS, industrial communications and measurement systems); degree with distinction"], ["2000–2004", "University of Miskolc", "Undergraduate degree in Electrical Engineering; digital systems, microprocessors, PLC, FPGA and CPLD; excellent final examination"], ["1983–1987", "Vak Bottyán János Technical Secondary School, Gyöngyös", "Electrical Technician"]], "courses": [["1999–2000", "Benetton, Vicenza – automation in textile manufacturing and warehousing"], ["2008", "Manpower – management skills training"], ["2006", "L+L – fire safety examination"], ["2005", "Valid Management Academy – ISO/TS 16949 and ISO 14001"], ["2004", "ÉKKO – weighing-equipment operator"], ["1999", "FAMACC and COMEL, Italy – mechanical/pneumatic systems, steam generators and industrial ironing equipment"], ["1998", "BMI, Italy – mechanical operations training"], ["1997–1999", "Benetton Group, Vicenza – Italian–Hungarian technical language"], ["1989–1990", "BMTTI, Budapest – reserve officer training"]], "langs": "Hungarian: native · Italian: negotiation-level · English: professional working communication", "foot": "* “Present” reflects the CV saved on 9 August 2026; current employment status should be confirmed before publication.", "researchHeading": "Research summary and scientific contributions", "researchBlocks": [["Electrical harmonics as a source of state information", "The electrical harmonic spectrum does not directly diagnose specific faults. Instead, it provides multidimensional state information that, with mathematical processing, feature engineering and machine learning, can help distinguish failure-related changes from natural operating variations."], ["Adaptive predictive maintenance", "Predictive modelling, statistical evaluation, clustering and rule-based decision support jointly inform alarm levels, maintenance priorities and recommended interventions. Identified Warning states were compared with maintenance and failure information recorded in SAP PM."], ["OAP – Organically Adaptive Predictive meta-architecture", "Inspired by the functional analogy of biological homeostasis, OAP is not a new machine-learning algorithm. It is a higher-level architecture adapting prediction-error evaluation through dynamic thresholds, drift-dependent correction and persistence-based decisions without requiring continuous model retraining."], ["Empirical industrial validation", "Evaluation on real industrial data identified 39 dynamic anomaly episodes. The documented EE206 “Comp 1 protections” Critical (A) event occurred within the ninth OAP dynamic episode. This temporal correspondence supports operational relevance but does not, by itself, establish causality."], ["Practical applicability", "Where industrial power-monitoring infrastructure provides harmonics of sufficient resolution and quality, the approach may extend existing measurements to condition monitoring without a separate dedicated diagnostic measurement system. Feature selection, training and decision thresholds remain equipment-specific."], ["Future research", "Direct online measurement integration and long-term industrial validation; controlled recalibration; explainable AI; robust uncertainty handling; phase-angle features; synthetic augmentation and domain adaptation; Digital Twins and Edge AI. The book’s Jetson/ONNX functional demonstration replayed recorded industrial data chronologically and did not establish long-term, direct online industrial validation."]]}}</script><script id="publications-data" type="application/json">[{"year": 2026, "hu": "Correction Functions and Refinement Algorithms for Enhancing the Performance of Machine Learning Models", "en": "Correction Functions and Refinement Algorithms for Enhancing the Performance of Machine Learning Models", "source": "AUTOMATION 7(2), Paper 45, 82 p.", "mtmt": "36996650", "kind": "journal"}, {"year": 2025, "hu": "Developing a model to simulate harmonic injections within an industrial facility", "en": "Developing a model to simulate harmonic injections within an industrial facility", "source": "Journal of Physics: Conference Series 3142, 012005", "mtmt": "36442898", "kind": "journal"}, {"year": 2024, "hu": "Villamos hálózatok analízise ipari létesítményekben", "en": "Analysis of Electrical Networks in Industrial Facilities", "source": "Doktoranduszok Fóruma, pp. 80–85", "mtmt": "36896475", "kind": "conference"}, {"year": 2025, "hu": "Villamos harmonikusok vizsgálata anomália detektálás céljából", "en": "Investigation of Electrical Harmonics for Anomaly Detection", "source": "Jelenkori Társadalmi és Gazdasági Folyamatok 20(3), pp. 111–125", "mtmt": "36406992", "kind": "journal"}, {"year": 2025, "hu": "Korrekciós függvények és javító algoritmusok a gépi tanulásban", "en": "Correction Functions and Improvement Algorithms in Machine Learning", "source": "Fizikai és Elektrotechnikai Szeminárium 2025, pp. 20–31", "mtmt": "36492203", "kind": "chapter"}, {"year": 2024, "hu": "Elektromos tranziensek ipari létesítményekben", "en": "Electrical Transients in Industrial Facilities", "source": "GÉP 75(2), pp. 28–34", "mtmt": "35218674", "kind": "journal"}, {"year": 2024, "hu": "A feszültség és áram harmonikus torzítások, az IEEE 519-2022 szabvány", "en": "Voltage and Current Harmonic Distortions and the IEEE 519-2022 Standard", "source": "GÉP 75(1), pp. 35–38", "mtmt": "34786234", "kind": "journal"}, {"year": 2024, "hu": "Hegesztő berendezések hatása a villamos energia minőségére", "en": "Impact of Welding Equipment on Power Quality", "source": "Hegesztéstechnika XXXIV(3), pp. 63–69", "mtmt": "35347024", "kind": "journal"}, {"year": 2024, "hu": "Egy háztartási méretű kiserőmű megtérülési idejének vizsgálata különböző elszámolási formák esetén", "en": "Payback Period of a Residential-Scale Power Plant under Different Billing Schemes", "source": "120 éves jubileumi konferencia, pp. 113–121", "mtmt": "35633406", "kind": "chapter"}, {"year": 2024, "hu": "Integrált harmonikus szűrők hatékonyságának vizsgálata", "en": "Investigation of the Effectiveness of Integrated Harmonic Filters", "source": "120 éves jubileumi konferencia, pp. 60–75", "mtmt": "35633403", "kind": "chapter"}, {"year": 2024, "hu": "Hálózatra visszatápláló háztartási méretű kiserőmű villamos jelalak formáló hatásának vizsgálata a lakossági villamos hálózaton", "en": "Investigation of the Waveform-Shaping Effect of a Grid-Connected Residential-Scale Power Plant", "source": "XXXIX. Kandó Konferencia 2023, pp. 18–30", "mtmt": "35382470", "kind": "chapter"}, {"year": 2024, "hu": "Hálózatra visszatápláló HMKE által termelt és a háztartás által fogyasztott villamos energia adatok elemzése", "en": "Analysis of Electricity Generation and Consumption Data for a Grid-Connected Residential-Scale Power Plant", "source": "XXXIX. Kandó Konferencia 2023, pp. 6–17", "mtmt": "35381802", "kind": "chapter"}, {"year": 2024, "hu": "EV töltők villamos analízise", "en": "Electrical Analysis of EV Chargers", "source": "Villamosenergia-felhasználást optimalizáló innovatív rendszer fejlesztése, pp. 68–75", "mtmt": "34803201", "kind": "chapter"}, {"year": 2024, "hu": "Impact of welding equipment on power quality", "en": "Impact of welding equipment on power quality", "source": "China Welding (English Edition) 33(3), pp. 44–51", "mtmt": "35475255", "kind": "journal"}, {"year": 2024, "hu": "Electrical Transients in Industrial Facilities", "en": "Electrical Transients in Industrial Facilities", "source": "Energies 17(17), Paper 4
